<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#020617">
<title>Para ti ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #020617;
    overscroll-behavior: none; touch-action: manipulation;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    height: 100vh; height: 100dvh;
    font-family: 'Playfair Display', Georgia, serif;
  }
  /* Área del cuadro: se calcula en JS (contain en horizontal, cover en vertical) */
  #art {
    position: absolute; left: 50%; top: 50%;
    width: 100px; height: 80px;
    transform: translate(-50%, -50%);
  }
  #board { position: absolute; inset: 0; background-size: 100% 100%; background-repeat: no-repeat; }
  .piece {
    position: absolute; background-repeat: no-repeat; opacity: 0;
    will-change: transform, opacity;
    box-shadow: 0 6px 18px rgba(0,0,0,.55);
  }
  .piece.done { box-shadow: none; }
  #flash {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 45%, rgba(253,224,71,.55), rgba(253,224,71,0) 65%);
  }
  #flash.go { animation: flash 1.6s ease-out; }
  @keyframes flash { 0% {opacity:0} 25% {opacity:1} 100% {opacity:0} }
  #veil {
    position: absolute; inset: 0; pointer-events: none;
    background: rgba(0,0,0,.74); opacity: 0;
    transition: opacity 2.4s ease-in-out;
    display: flex; align-items: center; justify-content: center;
  }
  #veil.on { opacity: 1; }
  #msg {
    margin: 0; padding: 0 7vw; text-align: center;
    font-style: italic; font-weight: 500;
    font-size: clamp(1.6rem, 5.2vw, 3.4rem);
    line-height: 1.55; letter-spacing: .04em;
    color: #fde68a;
    text-shadow: 0 0 12px rgba(253,224,71,.6), 0 0 34px rgba(253,224,71,.35);
    opacity: 0; transform: translateY(14px) scale(.97);
    transition: opacity 2.8s ease-out, transform 2.8s ease-out;
    position: relative; z-index: 2;
  }
  #msg.on { opacity: 1; transform: none; animation: breathe 5s ease-in-out 3s infinite; }
  @keyframes breathe {
    50% { text-shadow: 0 0 18px rgba(253,224,71,.85), 0 0 50px rgba(253,224,71,.5); }
  }
  .spark {
    position: absolute; width: 4px; height: 4px; border-radius: 50%;
    background: #fde68a; box-shadow: 0 0 8px 2px rgba(253,224,71,.7);
    opacity: 0; animation: twinkle var(--d) ease-in-out var(--t) infinite;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: translateY(0) scale(.5); }
    50% { opacity: .9; transform: translateY(-14px) scale(1.2); }
  }
  #hint {
    position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    text-align: center; font-size: .8rem; letter-spacing: .12em;
    color: rgba(253,230,138,.55); opacity: 0; transition: opacity 1.5s ease;
    pointer-events: none;
  }
  #hint.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    #veil, #msg { transition-duration: .6s; }
    .spark, #msg.on { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">
  <div id="art">
    <div id="board"></div>
    <div id="flash"></div>
  </div>
  <div id="veil"><p id="msg">Yo vi en ti lo que Van Gogh<br>en las estrellas</p></div>
  <div id="hint">toca para verlo otra vez</div>
</div>

<script>
(() => {
  const IMG = 'https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/1280px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg';
  const COLS = 12, ROWS = 8;
  const FLIGHT = 2200, SPREAD = 2400, PAUSE = 1500;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), art = $('art'), board = $('board'), flash = $('flash');
  const veil = $('veil'), msg = $('msg'), hint = $('hint');
  let ratio = 1.258, pieces = [], timers = [], busy = false;

  // Escritorio: el cuadro completo. Teléfono vertical: llena la pantalla (recorta los lados).
  function fit() {
    const vw = innerWidth, vh = innerHeight;
    const portrait = vw / vh < 1;
    const w = portrait ? Math.max(vw, vh * ratio) : Math.min(vw, vh * ratio);
    art.style.width = w + 'px';
    art.style.height = (w / ratio) + 'px';
  }
  addEventListener('resize', fit);

  const later = (fn, ms) => timers.push(setTimeout(fn, ms));

  function reset() {
    timers.forEach(clearTimeout); timers = [];
    pieces.forEach(p => p.remove()); pieces = [];
    board.style.backgroundImage = '';
    veil.classList.remove('on'); msg.classList.remove('on'); hint.classList.remove('on');
    flash.classList.remove('go');
    veil.querySelectorAll('.spark').forEach(s => s.remove());
  }

  function start() {
    reset(); busy = true;
    const vw = innerWidth, vh = innerHeight;
    const w = 100 / COLS, h = 100 / ROWS;

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const p = document.createElement('div');
        p.className = 'piece';
        p.style.cssText =
          `width:${w}%;height:${h}%;left:${c * w}%;top:${r * h}%;` +
          `background-image:url(${IMG});background-size:${COLS * 100}% ${ROWS * 100}%;` +
          `background-position:${c / (COLS - 1) * 100}% ${r / (ROWS - 1) * 100}%;`;

        const ang = Math.random() * Math.PI * 2;
        const dist = Math.max(vw, vh) * (1.1 + Math.random() * 0.9);
        const rot = (Math.random() - 0.5) * 1440;
        p.style.transform =
          `translate(${Math.cos(ang) * dist}px,${Math.sin(ang) * dist}px) rotate(${rot}deg) scale(.4)`;

        // Se arma desde el centro hacia afuera, con algo de azar
        const dx = (c + .5) / COLS - .5, dy = (r + .5) / ROWS - .5;
        const d = Math.hypot(dx, dy) / .6;
        const delay = d * SPREAD * .7 + Math.random() * SPREAD * .3;
        p.style.transition =
          `transform ${FLIGHT}ms cubic-bezier(.22,1,.36,1) ${delay}ms,` +
          `opacity 500ms ease-out ${delay * .4}ms`;
        art.insertBefore(p, flash);
        pieces.push(p);
      }
    }

    requestAnimationFrame(() => requestAnimationFrame(() => {
      pieces.forEach(p => {
        p.style.transform = 'translate(0,0) rotate(0deg) scale(1)';
        p.style.opacity = '1';
      });
    }));

    const assembled = SPREAD + FLIGHT + 100;

    // Quita sombras y sustituye las piezas por la imagen continua (sin costuras)
    later(() => {
      pieces.forEach(p => p.classList.add('done'));
      board.style.backgroundImage = `url(${IMG})`;
      flash.classList.add('go');
      requestAnimationFrame(() => { pieces.forEach(p => p.remove()); pieces = []; });
    }, assembled);

    // Mensaje
    later(() => {
      veil.classList.add('on');
      sparkles();
      later(() => msg.classList.add('on'), 900);
      later(() => { hint.classList.add('on'); busy = false; }, 4500);
    }, assembled + PAUSE);
  }

  function sparkles() {
    for (let i = 0; i < 22; i++) {
      const s = document.createElement('span');
      s.className = 'spark';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--d', (2.5 + Math.random() * 3) + 's');
      s.style.setProperty('--t', (Math.random() * 3) + 's');
      veil.appendChild(s);
    }
  }

  stage.addEventListener('click', () => { if (!busy) start(); });

  const probe = new Image();
  probe.onload = () => { ratio = probe.naturalWidth / probe.naturalHeight; fit(); start(); };
  probe.onerror = () => { fit(); start(); };
  fit();
  probe.src = IMG;
})();
</script>
</body>
</html>
